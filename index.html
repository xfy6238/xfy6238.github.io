<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>xfy6238 · 个人主页</title>
<style>
  :root { --ink: #1c1917; --muted: #78716c; --line: #e8e6e1; --paper: #fafaf9; --accent: #5a6c5e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--paper); color: var(--ink); line-height: 1.8; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 72px 24px; }
  h1 { font-size: 30px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin-top: 8px; font-size: 15px; }
  hr { border: none; border-top: 1px solid var(--line); margin: 36px 0; }
  h2 { font-size: 17px; margin-bottom: 12px; }
  .repo { display: block; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; text-decoration: none; color: inherit; background: #fff; transition: transform .15s ease; }
  .repo:hover { transform: translateY(-2px); }
  .repo b { font-size: 16px; }
  .repo span { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .tag { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 0 8px; margin-left: 8px; vertical-align: middle; }
  footer { color: var(--muted); font-size: 12px; margin-top: 40px; }
  a.more { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">

  </a>
  <a class="repo" href="https://github.com/xfy6238/LocalBob">
    <b>LocalBob<span class="tag">macOS 工具</span></b>
    <span>菜单栏离线翻译：Swift 6 零依赖，只调本机 Ollama。</span>
  </a>

  <footer>

    由 GitHub Pages 托管

</div>
</body>
</html>
